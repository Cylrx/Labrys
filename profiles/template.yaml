# Fictional example; replace every environment-specific requirement with verified facts.
owner_label_key: example.org/owner
namespace_rules:
  research:
    placement:
      cpu_required_selector:
        example.org/pool: cpu
      gpu_required_selector:
        example.org/pool: gpu
    resources:
      requests_equal_limits: true
      per_gpu: {cpu: "8", memory: 32Gi}
    gpu_types:
      - value: example-gpu
        resource_name: nvidia.com/gpu
        selector:
          example.org/gpu-model: example-gpu
    storage:
      kind: hostPath
      allowed_source_roots: [/shared/projects]
      require_same_mount_path: false
      mount_read_only: false
      supplemental_mounts:
        - name: workspace
          mount_path: /workspace
          medium: disk
          size_limit: 10Gi
    runtime:
      default: {mode: image_default}
      exact_images:
        registry.example.invalid/research/base:v1:
          mode: command_override
          command: [sleep, infinity]
          args: []
    registry_rules:
      - registry: registry.example.invalid
        repository_prefix: research
        pull_secret_names: [example-pull-secret]
    unmatched_registry: reject
